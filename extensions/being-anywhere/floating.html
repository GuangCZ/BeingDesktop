<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeingAnywhere</title><link rel="stylesheet" href="ui.css"></head>

    <div id="transcript"></div><div id="being-progress"></div>

    <div class="install-entry"><button id="install-toggle" type="button" aria-expanded="false" aria-controls="install-form" title="安装 MCP / Skill 链接">↗ 安装链接</button></div>
    <form id="install-form" class="install-form" hidden>
      <label for="install-url">MCP / Skill 链接</label>
      <input id="install-url" type="url" required maxlength="2048" placeholder="https://github.com/owner/repo" autocomplete="off" spellcheck="false">
      <div class="install-row"><select id="install-kind" aria-label="链接类型"><option value="auto">自动识别</option><option value="mcp">MCP</option><option value="skill">Skill</option></select><button id="install-submit" type="submit">安装到 Being ↗</button></div>
      <p class="small muted">由当前 Being 安装并核对结果，需要补充信息时在对话中继续。</p>
    </form>
    <form id="chat-form" class="composer"><textarea id="prompt" maxlength="8000" aria-label="给 Being 的消息" placeholder="继续问…" rows="2"></textarea><div class="composer-bottom"><span id="activity" class="small muted" role="status" aria-live="polite">就绪</span><div><button id="stop" type="button" class="small" hidden>停止</button><button id="send" class="primary send" type="submit" aria-label="发送消息"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m-5 5 5-5 5 5"/></svg></button></div></div></form>
    <div id="error" class="error" role="alert" hidden></div>
  </footer>
  <script type="module" src="sidepanel.mjs"></script>
</body></html>
